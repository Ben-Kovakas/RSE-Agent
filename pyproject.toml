[project]
name = "rse-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Ben-Kovakas",email = "benjaminkovakas@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "langgraph (>=1.0.5,<2.0.0)",
    "langchain-anthropic (>=1.3.0,<2.0.0)",
    "e2b-code-interpreter (>=2.4.1,<3.0.0)",
    "streamlit (>=1.52.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)"
]

[tool.poetry]
packages = [{include = "rse_agent", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
